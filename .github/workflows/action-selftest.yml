name: Action self-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Start local fixture servers
        run: |
          uv sync --locked
          # The venv interpreter, not `uv run`: a long-lived uv process keeps the cache locked
          # and setup-uv's post-job cache prune times out waiting for it.
          nohup .venv/bin/python scripts/demo_servers.py > demo.log 2>&1 &
          for _ in $(seq 30); do curl -s -o /dev/null http://127.0.0.1:8402/mcp && exit 0; sleep 1; done
          cat demo.log; exit 1
      - name: Run the action against the misconfigured fixture
        id: scan
        uses: ./
        with:
          targets: |
            http://127.0.0.1:8402/mcp  # misconfigured fixture
          args: --allow-private --retries 0
          upload-sarif: "false"
          fail: "false"
      - name: Check outputs
        env:
          CODE: ${{ steps.scan.outputs.exit-code }}
          SARIF: ${{ steps.scan.outputs.sarif-file }}
          REPORT: ${{ steps.scan.outputs.json-file }}
        run: |
          test "$CODE" = "1"
          jq -e '.runs[0].results | length > 0' "$SARIF"
          jq -e '.targets[0].findings | map(.check_id) | index("MCPP-ASM04") != null' "$REPORT"
      - name: Stop fixture servers
        if: always()
        run: pkill -f scripts/demo_servers.py || true
