version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/workflows"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
      runtime:
        dependency-type: production
    commit-message:
      prefix: deps
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
