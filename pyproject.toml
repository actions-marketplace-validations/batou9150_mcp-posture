[project]
name = "mcp-posture"
version = "1.0.0-rc1"
description = "Security posture scanner for remote MCP servers: OAuth, transport and tool surface, with spec-cited findings and SARIF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Baptiste PIRAULT" }]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "oauth", "security", "scanner", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "mcp-types>=2.3,<3",
    "pydantic>=2.12",
    "rich>=13.9",
    "typer>=0.16",
]

[project.urls]
Homepage = "https://github.com/batou9150/mcp-posture"
Documentation = "https://batou9150.github.io/mcp-posture/"
Issues = "https://github.com/batou9150/mcp-posture/issues"

[project.scripts]
mcp-posture = "mcp_posture.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "jsonschema>=4.20",
    "mcp>=2.3,<3",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "pyyaml>=6.0.3",
    "ruff>=0.6",
    "trustme>=1.1",
    "types-jsonschema",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn>=0.31",
]

docs = [
    "mkdocs>=1.6,<2",  # MkDocs 2 drops the plugin system mkdocs-material relies on
    "mkdocs-gen-files>=0.5",
    "mkdocs-material>=9.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# Source, tests and the files needed to build and test; not the repo's CI, docs site or media.
include = [
    "/src",
    "/tests",
    "/scripts",
    "/docs/schema",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "RUF001"]
"src/mcp_posture/heuristics.py" = ["E501", "RUF001"]  # regex tables and homoglyph map

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "check(kind, *ids): links a test to catalogue check IDs; kind is 'positive' or 'negative'",
    "network: binds local sockets (uvicorn, TLS)",
]
addopts = "--cov=mcp_posture --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
